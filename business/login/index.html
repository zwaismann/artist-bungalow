<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Sign in - Spatial Escapes Business Book</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 fill=%22%231A1A1A%22/><text x=%2216%22 y=%2222%22 font-family=%22serif%22 font-size=%2216%22 fill=%22%23C49A3C%22 text-anchor=%22middle%22>AB</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    :root { --ivory:#FAF6F0; --onyx:#1A1A1A; --brass:#C49A3C; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--onyx);
      color: var(--ivory);
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    main { width: 100%; max-width: 28rem; }
    .kicker { font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--brass); margin-bottom: 16px; }
    h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(48px, 12vw, 72px); line-height: 0.85; letter-spacing: 0.04em; }
    h1 span { color: var(--brass); }
    .lede { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.15rem; color: rgba(250,246,240,0.72); margin: 18px 0 28px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; min-height: 52px; padding: 14px 20px;
      font-family: inherit; font-size: 12px; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      border: 0; cursor: pointer; appearance: none;
    }
    .btn-brass { background: var(--brass); color: var(--onyx); }
    .btn-brass:hover { background: #a07e2f; }
    .btn-brass:disabled { opacity: 0.55; cursor: wait; }
    .ghost { display: inline-block; margin-top: 18px; color: rgba(250,246,240,0.45); font-size: 13px; }
    .ghost a { color: var(--brass); }
    details { margin-top: 36px; border-top: 1px solid rgba(250,246,240,0.08); padding-top: 20px; }
    summary { cursor: pointer; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(250,246,240,0.35); }
    label { display: block; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(250,246,240,0.4); margin: 16px 0 8px; }
    input {
      width: 100%; min-height: 48px; padding: 12px 14px;
      background: transparent; border: 1px solid rgba(250,246,240,0.2);
      color: var(--ivory); font-family: inherit; font-size: 15px;
    }
    .btn-ghost {
      margin-top: 12px; background: transparent; color: var(--ivory);
      border: 1px solid rgba(250,246,240,0.28);
    }
    .msg { margin-top: 18px; font-size: 14px; line-height: 1.5; color: #E8CFC0; min-height: 1.5em; }
    .home { display: block; margin-top: 40px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(250,246,240,0.28); }
    .home:hover { color: var(--brass); }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Spatial Escapes · Confidential</p>
    <h1>BUSINESS<br><span>BOOK</span></h1>
    <p class="lede">Sign in with the passkey on this Mac. Touch ID or Face ID unlocks the book.</p>
    <button class="btn btn-brass" type="button" id="passkeyBtn">Sign in with passkey</button>
    <p class="ghost">First time? <a href="/business/enroll">Create a passkey</a></p>
    <p class="msg" id="msg" role="status"></p>
    <details id="fallback" open>
      <summary>Passkey unavailable? Use backup password or setup token</summary>
      <form id="passwordForm">
        <label for="password">Backup password or setup token</label>
        <input id="password" name="password" type="text" autocomplete="off" spellcheck="false" />
        <button class="btn btn-ghost" type="submit">Sign in with password</button>
      </form>
    </details>
    <a class="home" href="/">Return to the public site</a>
  </main>
  <script>
    (function () {
      var form = document.getElementById('passwordForm');
      var msg = document.getElementById('msg');
      var params = new URLSearchParams(location.search);
      var next = params.get('next') || '/business';
      var safeNext = next.startsWith('/business') || next.startsWith('/business-book') ? next : '/business';
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        e.stopImmediatePropagation();
        msg.textContent = '';
        var password = document.getElementById('password').value.trim();
        var res = await fetch('/api/business-auth/password', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password }),
        });
        var result = {};
        try { result = await res.json(); } catch (err) {}
        if (!res.ok) {
          msg.textContent = result.error || 'Password sign-in failed.';
          return;
        }
        location.assign(safeNext);
      });
    })();
  </script>
  <script type="module">
    import { startAuthentication } from 'https://esm.sh/@simplewebauthn/browser@13.3.0';

    const msg = document.getElementById('msg');
    const passkeyBtn = document.getElementById('passkeyBtn');
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/business';
    const safeNext = next.startsWith('/business') || next.startsWith('/business-book') ? next : '/business';

    function setMsg(text) { msg.textContent = text || ''; }

    async function parseJson(res) {
      try { return await res.json(); } catch { return {}; }
    }

    const status = await fetch('/api/business-auth/status', { credentials: 'same-origin' }).then(parseJson);
    if (status.hasPasswordFallback === false) {
      document.getElementById('fallback').hidden = true;
    }

    passkeyBtn.addEventListener('click', async () => {
      setMsg('Touch ID or your device passkey should appear next.');
      passkeyBtn.disabled = true;
      try {
        const optRes = await fetch('/api/business-auth/login-options', { method: 'POST', credentials: 'same-origin' });
        const options = await parseJson(optRes);
        if (!optRes.ok) throw new Error(options.error || 'Could not start passkey sign-in.');
        const assertion = await startAuthentication({ optionsJSON: options });
        const loginRes = await fetch('/api/business-auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(assertion),
        });
        const result = await parseJson(loginRes);
        if (!loginRes.ok) throw new Error(result.error || 'Passkey sign-in failed.');
        location.assign(safeNext);
      } catch (err) {
        const cancelled = err?.name === 'NotAllowedError';
        setMsg(cancelled ? 'Passkey prompt was cancelled.' : (err.message || 'Passkey sign-in failed.'));
        passkeyBtn.disabled = false;
        if (!cancelled) document.getElementById('fallback').open = true;
      }
    });

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      setMsg('');
      const password = document.getElementById('password').value;
      const res = await fetch('/api/business-auth/password', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const result = await parseJson(res);
      if (!res.ok) {
        setMsg(result.error || 'Password sign-in failed.');
        return;
      }
      location.assign(safeNext);
    });
  </script>
</body>
</html>
