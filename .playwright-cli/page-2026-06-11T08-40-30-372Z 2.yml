  - generic [ref=e203]:
    - generic [ref=e204]:
      - generic [ref=e205]: 05 // The Vibe
      - heading "Voice & Photography" [level=2] [ref=e206]
    - generic [ref=e207]:
      - generic [ref=e208]:
        - heading "Tone of Voice" [level=3] [ref=e209]
        - list [ref=e210]:
          - listitem [ref=e211]:
            - strong [ref=e212]: "Warm & Personal:"
            - text: Never sound corporate. Speak with local expertise and casual authority.
          - listitem [ref=e213]:
            - strong [ref=e214]: "Dual Perspective:"
            - text: Use the property as the protagonist ("A retreat perched in the hills...") but switch to second-person for experiential moments ("Your mornings start with canyon light...").
          - listitem [ref=e215]:
            - strong [ref=e216]: "Sensory Language:"
            - text: Focus on light, breeze, views, and warmth.
          - listitem [ref=e217]:
            - strong [ref=e218]: "Confidentiality:"
            - text: Keep hosts private. No host names or personal identities.
          - listitem [ref=e219]:
            - strong [ref=e220]: "Formatting:"
            - text: Short sentences. Confident pacing. Never use em-dashes (—).
      - generic [ref=e221]:
        - heading "Visual Layout" [level=3] [ref=e222]
        - list [ref=e223]:
          - listitem [ref=e224]:
            - strong [ref=e225]: "Asymmetric Grids:"
            - text: Avoid perfectly uniform boxes to keep the layout feeling organic and editorial.
          - listitem [ref=e226]:
            - strong [ref=e227]: "Whitespace:"
            - text: Use generous negative space. Let the content breathe.
          - listitem [ref=e228]:
            - strong [ref=e229]: "Sharp Edges:"
            - text: No rounded corners on photographs. Keeps the design architectural and crisp.
          - listitem [ref=e230]:
            - strong [ref=e231]: "Minimal Decor:"
            - text: Use thin horizontal rules as dividers. Avoid heavy drop shadows or bordered cards.
          - listitem [ref=e232]:
            - strong [ref=e233]: "Micro-Interactions:"
            - text: Subtle fade-up scroll reveals (0.7s) and parallax hero images. Hover gallery zooms limited to a gentle 1.05 scale.
