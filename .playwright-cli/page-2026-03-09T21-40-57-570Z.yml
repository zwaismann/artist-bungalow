          - heading "How it works" [level=2] [ref=e198]
          - paragraph [ref=e200]: Furnished Finder specializes in 30-day or longer stays, catering to corporate travelers, relocating families, travel nurses, academics, and digital nomads—not vacationers. We allow direct communication between landlords and tenants without interfering in the transaction process. You have the freedom and flexibility to vet your guests and use whatever form of payment you prefer. Notably, there are no booking fees or mark-ups on rental rates, so you can manage your bookings and keep your money.
        - link "Have a property to rent?" [ref=e203] [cursor=pointer]:
          - /url: /list-your-property
