        - generic [ref=e172] [cursor=pointer]: Who is Blotato for?
        - paragraph [ref=e175]:
          - text: Blotato is for solopreneurs, content creators, small business owners, and small digital agencies who are building brands, communities, or faceless channels.
          - text: I built Blotato to scale myself as a solo creator and I use it daily, as I've grown from 0 to 500k+ followers in 6 months, all organic social, no team, no VAs, $0 ad spend.
          - text: Blotato combines 8-apps-in-1 to streamline content creation across multiple platforms. You can create new content, repurpose any existing content, manage prompts, schedule and publish posts, generate AI images, cross-post on platforms, and generate high-quality faceless AI videos.
          - text: So you can focus on your main business, while growing your brand/audience in a few hours per week.
          - text: ‍
          - strong [ref=e176]:
            - text: "Easily remix any content across multiple platforms, for example:"
            - text: ‍
            - text: "-"
          - text: remix 1 tiktok → instagram post, tweet
          - text: "- remix 2 articles, 2 PDFs → viral youtube script"
          - text: "- remix 3 youtube videos → 1500-word blog, linkedin post, tweet"
      - generic [ref=e177]:
        - generic [ref=e179] [cursor=pointer]: Who is Blotato NOT for?
        - paragraph [ref=e182]:
          - text: Blotato is NOT for video clipping, i.e. taking long form videos and clipping them into short videos.
          - text: Blotato is NOT for automated low-quality AI content generation. It's designed for you to easily add your insights and perspective to posts.
          - text: Blotato is NOT for you if you're just starting out and you're not serious about growing a personal brand or business brand.
